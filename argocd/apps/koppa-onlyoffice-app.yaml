apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: koppa-kustomize-onlyoffice
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/lyhovseab/argocd-apps.git
    targetRevision: HEAD
    path: kustomize/onlyoffice/overlays/koppa
  destination:
    server: https://kubernetes.default.svc
    namespace: koppa
  syncPolicy:
    syncOptions:
    - CreateNamespace=true
    automated:
      selfHeal: true
      prune: true
