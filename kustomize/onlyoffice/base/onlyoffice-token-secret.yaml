apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: onlyoffice-docserver
spec:
  refreshInterval: "1m"
  secretStoreRef:
    name: koppa-vault-backend
    kind: ClusterSecretStore
  target:
    name: onlyoffice-docserver
  data:
  - secretKey: jwt-secret
    remoteRef:
      key: "koppa"
      property: "jwt-secret"
