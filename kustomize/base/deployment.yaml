---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: maintenance-deployment
spec:
  replicas: 1
  template:
    metadata:
    spec:
      containers:
        - image: nginx:1.28.0-alpine-perl
          imagePullPolicy: IfNotPresent
          name: maintenance
          ports:
            - containerPort: 8080
              protocol: TCP
          volumeMounts:
            - mountPath: /etc/nginx/conf.d/default.conf
              name: vhost-config
              subPath: default.conf
            - mountPath: /usr/share/nginx/html/index.html
              name: html-content
              subPath: index.html
      volumes:
        - configMap:
            defaultMode: 420
            name: maintenance-vhost-config
          name: vhost-config
        - configMap:
            defaultMode: 420
            name: maintenance-html-content
          name: html-content
