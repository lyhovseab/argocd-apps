apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-maintenance
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/lyhovseab/argocd-apps.git
    targetRevision: HEAD
    path: maintenance
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd-apps

syncPolicy:
    syncOptions:
    - CreateNamespace=true
    automated:
      selfHeal: true
      prune: true
